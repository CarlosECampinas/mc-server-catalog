services:
  app:
    build:
      context: .
    ports:
      - "5173:5173"
    volumes:
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: sync+restart
          path: ./vite.config.js
          target: /app/vite.config.js
        - action: sync+restart
          path: ./package.json
          target: /app/package.json
        - action: sync+restart
          path: ./package-lock.json
          target: /app/package-lock.json

volumes:
  node_modules:
